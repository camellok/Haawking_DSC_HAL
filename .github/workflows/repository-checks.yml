name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository boundaries
        run: python tools/check_repository.py

      - name: Build and run target-independent queue tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iinclude \
            source/common/hal_queue.c \
            tests/test_hal_queue.c \
            -o "$RUNNER_TEMP/test_hal_queue"
          "$RUNNER_TEMP/test_hal_queue"

      - name: Check public headers and C linkage from C++
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iinclude \
            -c tests/test_hal_can_c_linkage.c \
            -o "$RUNNER_TEMP/test_hal_can_c_linkage.o"
          c++ -std=c++11 -Wall -Wextra -Werror \
            -Iinclude \
            tests/test_public_headers.cpp \
            "$RUNNER_TEMP/test_hal_can_c_linkage.o" \
            -o "$RUNNER_TEMP/test_public_headers"
          "$RUNNER_TEMP/test_public_headers"
