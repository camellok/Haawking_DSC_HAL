name: 外设或平台提案
description: 提议新增外设能力、目标芯片实现或平台验证
title: "[Proposal] "
labels: ["type: proposal"]
body:
  - type: textarea
    id: use_case
    attributes:
      label: 真实使用场景
      description: 说明宿主项目为什么需要这项能力。
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: 目标芯片与DriverLib
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: 建议的公共能力与职责边界
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: Platform资源与实时约束
  - type: textarea
    id: acceptance
    attributes:
      label: 验收方法
    validations:
      required: true
